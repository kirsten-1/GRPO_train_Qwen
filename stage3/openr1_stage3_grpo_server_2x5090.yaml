# Open-R1 Stage3 config - Code training with math retention
# Start from: Stage2 v2 checkpoint-24244
# Data: 51,888 samples (36,888 code + 15,000 math)
# Duration: 0.5 epoch (~6,486 steps)

# Model arguments
model_name_or_path: /root/autodl-tmp/models/Qwen/Qwen2___5-3B-Instruct
model_revision: main
trust_remote_code: true
torch_dtype: bfloat16
attn_implementation: sdpa
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# Dataset arguments
dataset_name: /root/autodl-tmp/training_data/stage3_hf
dataset_train_split: train
dataset_prompt_column: problem
system_prompt: "You are a helpful AI Assistant. Think step by step, then answer in this format: <think>\\n...\\n</think>\\n<answer>\\n...\\n</answer>"

# GRPO trainer arguments
use_vllm: true
vllm_mode: server
vllm_server_base_url: http://127.0.0.1:8000
vllm_server_host: 127.0.0.1
vllm_server_port: 8000
vllm_server_timeout: 240.0
do_eval: false

# Training hyperparameters
max_steps: 30730  # 24244 + 6486 (0.5 epoch of stage3 data)
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 1.0e-5
warmup_steps: 50
lr_scheduler_type: cosine
max_grad_norm: 0.5

num_generations: 4
beta: 0.08
temperature: 0.7
max_prompt_length: 1024
max_completion_length: 1024  # Longer than Stage2 (512) for code output

bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

logging_strategy: steps
logging_steps: 10
logging_first_step: true
save_strategy: steps
save_steps: 500
save_total_limit: 8
report_to:
  - tensorboard

output_dir: /root/autodl-tmp/stage3_grpo_runs/openr1_stage3_server_2x5090
overwrite_output_dir: false
push_to_hub: false
seed: 42

# Reward functions - accuracy for math, format+tag_count for all
reward_funcs:
  - accuracy
  - format
  - tag_count
reward_weights:
  - 1.3  # Accuracy: restored from Stage2 v2's 1.2
  - 0.9  # Format: lowered from Stage2 v2's 1.5 (format already 91%)
  - 0.2  # Tag count: unchanged
