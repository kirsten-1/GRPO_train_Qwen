# Open-R1 Stage2 config (hard math focus) for 2x5090 in vLLM server mode.
# GPU0: training
# GPU1: vLLM server

# Model arguments
model_name_or_path: /root/autodl-tmp/models/Qwen/Qwen2___5-3B-Instruct
model_revision: main
trust_remote_code: true
torch_dtype: bfloat16
attn_implementation: sdpa
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# Dataset arguments
dataset_name: /root/autodl-tmp/training_data/stage2_hf
dataset_train_split: train
dataset_prompt_column: problem
system_prompt: "You are a helpful AI Assistant. Think step by step, then answer in this format: <think>\\n...\\n</think>\\n<answer>\\n...\\n</answer>"

# GRPO trainer arguments
use_vllm: true
vllm_mode: server
vllm_server_base_url: http://127.0.0.1:8000
vllm_server_host: 127.0.0.1
vllm_server_port: 8000
vllm_server_timeout: 240.0
do_eval: false

# Stage2 recommended hyperparameters
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 5.0e-6
warmup_steps: 50
lr_scheduler_type: cosine
max_grad_norm: 0.5

num_generations: 4
beta: 0.10
temperature: 0.7
max_prompt_length: 1024
max_completion_length: 512

bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

logging_strategy: steps
logging_steps: 10
logging_first_step: true
save_strategy: steps
save_steps: 500
save_total_limit: 8
report_to:
  - tensorboard

output_dir: /root/autodl-tmp/stage2_grpo_runs/openr1_stage2_server_2x5090
overwrite_output_dir: false
push_to_hub: false
seed: 42

# Reward registry
reward_funcs:
  - accuracy
  - format
  - tag_count
reward_weights:
  - 1.3
  - 0.9
  - 0.2
