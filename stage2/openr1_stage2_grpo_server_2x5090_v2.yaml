# Open-R1 Stage2 config v2 - Optimized for better learning
# Changes from v1:
# - lr: 5e-6 -> 1e-5 (Stage1 proven rate)
# - beta: 0.10 -> 0.08 (less constraint for hard tasks)
# - format_reward weight: 0.9 -> 1.5 (prioritize format correctness - KEY FIX)
# - accuracy_reward weight: 1.3 -> 1.2 (reduce penalty on hard tasks)
# - epochs: 1 -> 0.5 (quick validation, ~1,744 steps)
# - save_steps: 500 -> 250 (dense evaluation, 7 checkpoints)
# - start from checkpoint-22500 (verified best: MATH 38.0%, GSM8K 54.5%)

# Model arguments
model_name_or_path: /root/autodl-tmp/models/Qwen/Qwen2___5-3B-Instruct
model_revision: main
trust_remote_code: true
torch_dtype: bfloat16
attn_implementation: sdpa
use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

# Dataset arguments
dataset_name: /root/autodl-tmp/training_data/stage2_hf
dataset_train_split: train
dataset_prompt_column: problem
system_prompt: "You are a helpful AI Assistant. Think step by step, then answer in this format: <think>\\n...\\n</think>\\n<answer>\\n...\\n</answer>"

# GRPO trainer arguments
use_vllm: true
vllm_mode: server
vllm_server_base_url: http://127.0.0.1:8000
vllm_server_host: 127.0.0.1
vllm_server_port: 8000
vllm_server_timeout: 240.0
do_eval: false

# Optimized hyperparameters for Stage2 v2
# num_train_epochs: 0.5  # Cannot use epochs when resuming from a checkpoint with higher epoch count
max_steps: 24244  # checkpoint-22500 + 1744 steps (~0.5 epoch of stage2 data)
per_device_train_batch_size: 2
gradient_accumulation_steps: 2
learning_rate: 1.0e-5  # ← CHANGED: from 5e-6
warmup_steps: 50
lr_scheduler_type: cosine
max_grad_norm: 0.5

num_generations: 4
beta: 0.08  # ← CHANGED: from 0.10
temperature: 0.7
max_prompt_length: 1024
max_completion_length: 512

bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

logging_strategy: steps
logging_steps: 10
logging_first_step: true
save_strategy: steps
save_steps: 250  # ← CHANGED: from 500 (more frequent for 0.5 epoch)
save_total_limit: 8
report_to:
  - tensorboard

output_dir: /root/autodl-tmp/stage2_grpo_runs/openr1_stage2_server_2x5090_v2
overwrite_output_dir: false
push_to_hub: false
seed: 42

# Reward registry - rebalanced for format priority
reward_funcs:
  - accuracy
  - format
  - tag_count
reward_weights:
  - 1.2  # ← CHANGED: from 1.3 (reduce penalty on hard tasks)
  - 1.5  # ← CHANGED: from 0.9 (prioritize format learning)
  - 0.2  # unchanged
